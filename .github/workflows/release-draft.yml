# GitHub Actions workflow for creating draft releases with binaries
name: Draft Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Binaries and Create Draft Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Build binaries for all platforms
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Building version: ${VERSION}"
          
          mkdir -p dist
          
          # Define platforms
          platforms="linux/amd64:linux-amd64 linux/arm64:linux-arm64 darwin/amd64:darwin-amd64 darwin/arm64:darwin-arm64 windows/amd64:windows-amd64"
          
          for platform in $platforms; do
            GOOS="${platform%/*}"
            GOARCH="${platform##*/}"
            GOARCH="${GOARCH##*:}"
            SUFFIX="${platform##*:}"
            
            BINARY_NAME="pac-${SUFFIX}"
            if [ "$GOOS" = "windows" ]; then
              BINARY_NAME="pac-${SUFFIX}.exe"
            fi
            
            echo "Building for $GOOS/$GOARCH -> $BINARY_NAME"
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "dist/${BINARY_NAME}" ./cmd/pac
          done
          
          echo "Built binaries:"
          ls -lh dist/

      - name: Build Debian package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          make deb VERSION=${VERSION}
          cp bin/pac_${VERSION}_amd64.deb dist/

      - name: Build Chocolatey package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          make chocolatey VERSION=${VERSION}
          cd bin/chocolatey/pac/${VERSION}
          tar -czf pac-chocolatey-${VERSION}.tar.gz .
          cp pac-chocolatey-${VERSION}.tar.gz "${{ github.workspace }}/dist/"

      - name: Build Winget manifests
        run: |
          VERSION=${{ steps.version.outputs.version }}
          make winget VERSION=${VERSION}
          cd bin/winget/Praqma/pac/${VERSION}
          tar -czf pac-winget-${VERSION}.tar.gz .
          cp pac-winget-${VERSION}.tar.gz "${{ github.workspace }}/dist/"

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Create release notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cat > /tmp/release_notes.md <<'RELEASE_EOF'
# PAC v$VERSION Release

## Binaries

Available binaries for download:

### Linux
- pac-linux-amd64 - Linux x86_64
- pac-linux-arm64 - Linux ARM64

### macOS
- pac-darwin-amd64 - macOS Intel
- pac-darwin-arm64 - macOS Apple Silicon

### Windows
- pac-windows-amd64.exe - Windows x86_64

### Packages
- pac_$VERSION_amd64.deb - Debian/Ubuntu package
- pac-chocolatey-$VERSION.tar.gz - Chocolatey package
- pac-winget-$VERSION.tar.gz - Windows Package Manager manifests

## Installation

### Binary Installation
Download the binary for your platform and run:
```bash
chmod +x pac-linux-amd64  # On Linux/macOS
./pac-linux-amd64 --help
```

### Package Installation

#### Debian/Ubuntu
```bash
sudo dpkg -i pac_$VERSION_amd64.deb
```

#### Chocolatey
```powershell
choco install pac
```

## Verification
Download the SHA256SUMS file and verify the integrity of your downloaded binary:

```bash
sha256sum -c SHA256SUMS
```

## Changes
See the full changelog: [CHANGELOG.md](./CHANGELOG.md)
RELEASE_EOF
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "PAC v${{ steps.version.outputs.version }}"
          body: ${{ steps.release_notes.outputs.release_notes }}
          draft: true
          prerelease: false
          files: |
            dist/pac-linux-amd64
            dist/pac-linux-arm64
            dist/pac-darwin-amd64
            dist/pac-darwin-arm64
            dist/pac-windows-amd64.exe
            dist/pac_${{ steps.version.outputs.version }}_amd64.deb
            dist/pac-chocolatey-${{ steps.version.outputs.version }}.tar.gz
            dist/pac-winget-${{ steps.version.outputs.version }}.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/
          retention-days: 30
