# GitHub Actions workflow for building Debian packages
name: Build Debian Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the package (e.g., 4.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build Debian package
        run: make deb VERSION=${{ steps.version.outputs.version }}

      - name: Show package info
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DEBFILE="bin/pac_${VERSION}_amd64.deb"
          echo "Package built successfully:"
          ls -lh "${DEBFILE}"
          dpkg-deb --info "${DEBFILE}"
          dpkg-deb --contents "${DEBFILE}"

      - name: Test installation
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DEBFILE="bin/pac_${VERSION}_amd64.deb"
          
          echo "Testing package installation..."
          sudo dpkg -i "${DEBFILE}"
          
          echo "Verifying installation..."
          which pac
          pac --version || pac version || true
          
          echo "Package files:"
          dpkg -L pac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: "bin/*.deb"
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: "bin/*.deb"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
