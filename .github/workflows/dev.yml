# GitHub Actions workflow for dev builds
# Creates development builds when pushing to main
name: Dev Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  dev-build:
    name: Dev Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (Snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        run: |
          # Push dev-tagged images to ghcr.io
          images=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "ghcr.io/praqma/pac" || true)
          if [ -z "$images" ]; then
            echo "No Docker images found to push"
            exit 0
          fi
          echo "$images" | while read image; do
            echo "Pushing $image..."
            docker push "$image"
          done

      - name: Create/Update Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Development Build"
          prerelease: true
          draft: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
          body: |
            ## Development Build
            
            This is an automated development build from the `master` branch.
            
            **⚠️ Warning**: This is a development build and may be unstable.
            
            **Commit**: ${{ github.sha }}
            
            ### Installation
            
            **Docker (Recommended for dev)**:
            ```bash
            docker pull ghcr.io/praqma/pac:{{ .Version }}-{{ .ShortCommit }}-dev
            ```
            
            **Direct Download**:
            Download the appropriate binary for your platform from the assets below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-dist
          path: dist/
          retention-days: 7
